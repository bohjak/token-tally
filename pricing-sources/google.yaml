# Google (Gemini) model pricing — curated source of truth.
#
# All rates are USD per one million tokens (MTok) at Google AI list price.
# Rates shown are for the standard (non-batch) API tier.
# cacheWritePerMTokUSD = context-cache storage write rate (per MTok stored per hour,
#   but we treat it as the per-MTok creation overhead for consistency).
# cacheReadPerMTokUSD  = cached input token rate.
#
# Source: https://ai.google.dev/gemini-api/docs/pricing

provider: google
asOf: "2026-05-13"
sourceUrl: "https://ai.google.dev/gemini-api/docs/pricing"

models:
