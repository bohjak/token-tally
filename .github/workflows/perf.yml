name: Performance CI

on:
  schedule:
    # Weekly on Monday at 03:00 UTC — low-traffic time to reduce runner contention.
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  perf:
    name: Performance check (macOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@ab5d408e9d066b8ffe7503f789d50fd7e35c0c92 # v6.0.7
        with:
          version: 9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          xcode_path="$(ls -d /Applications/Xcode_16*.app | sort | tail -n 1)"
          sudo xcode-select -s "${xcode_path}"
          xcodebuild -version
          swift --version

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Cache the 1M-row performance fixture by generator-script hash so that
      # runs where fixtures/generate-large-db.ts is unchanged can reuse the
      # pre-built DB.  The key is OS-scoped because the DB format is
      # architecture-independent but generation time varies by runner.
      #
      # Note: scripts/release-check.sh currently always regenerates the fixture
      # via fixtures/generate-large-db.ts.  The cache will become a full
      # time-saver once check_perf gains a skip-if-exists guard.
      #
      # TODO(bohjak): pin actions/cache to a SHA once the v4 line stabilises.
      - name: Restore performance fixture
        id: perf-cache
        uses: actions/cache@v4
        with:
          path: /tmp/token-tally-large.db
          key: ${{ runner.os }}-perf-fixture-${{ hashFiles('fixtures/generate-large-db.ts') }}

      - name: Release check (with perf)
        # Run without --skip-perf to include fixture generation and the Swift
        # performance-budget assertions (hard limit: 2000 ms per query).
        run: scripts/release-check.sh
